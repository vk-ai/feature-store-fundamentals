[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-store-fundamentals"
version = "0.1.0"
description = "OSS learning demo: Feast-style offline/online feature store + schema versioning (not employer production)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vinay Vik", email = "vk-ai@users.noreply.github.com" }]
keywords = ["feature-store", "mlops", "learning", "feast-style"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0,<9"]

[project.scripts]
feature-store = "feature_store.cli:main"

[project.urls]
Homepage = "https://github.com/vk-ai/feature-store-fundamentals"
Repository = "https://github.com/vk-ai/feature-store-fundamentals"

[tool.setuptools.packages.find]
where = ["."]
include = ["feature_store*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
